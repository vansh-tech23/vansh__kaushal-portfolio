<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1c" />
      <stop offset="100%" stop-color="#0e1730" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad3)" />

  <!-- Ambient Glow -->
  <circle cx="300" cy="200" r="160" fill="#38bdf8" opacity="0.1" filter="url(#glow3)" />
  <circle cx="580" cy="260" r="140" fill="#818cf8" opacity="0.1" filter="url(#glow3)" />

  <!-- Main Container -->
  <rect x="55" y="40" width="690" height="370" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="rgba(56,189,248,0.3)" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="55" y="40" width="690" height="46" rx="16" fill="#1e293b" fill-opacity="0.9" />
  <rect x="55" y="70" width="690" height="16" fill="#1e293b" fill-opacity="0.9" />
  
  <circle cx="85" cy="63" r="5.5" fill="#ef4444" />
  <circle cx="103" cy="63" r="5.5" fill="#f59e0b" />
  <circle cx="121" cy="63" r="5.5" fill="#10b981" />

  <text x="400" y="68" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Interactive Data Structure &amp; Algorithm Visualizer</text>

  <!-- Left: Sorting Array Visualization -->
  <rect x="80" y="105" width="370" height="280" rx="12" fill="#050811" fill-opacity="0.9" stroke="rgba(255,255,255,0.06)" />
  
  <!-- Algorithm Controller Header -->
  <text x="105" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">QuickSort / Binary Search Visualizer</text>
  <rect x="360" y="122" width="70" height="20" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="0.8" />
  <text x="395" y="136" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#10b981" text-anchor="middle">O(N log N)</text>

  <!-- Bars Array -->
  <!-- 1 --> <rect x="105" y="300" width="20" height="60" rx="3" fill="url(#barGrad1)" />
  <!-- 2 --> <rect x="133" y="240" width="20" height="120" rx="3" fill="url(#barGrad1)" />
  <!-- 3 --> <rect x="161" y="270" width="20" height="90" rx="3" fill="url(#barGrad1)" />
  <!-- 4 Pivot --> <rect x="189" y="180" width="20" height="180" rx="3" fill="url(#highlightGrad)" />
  <!-- 5 --> <rect x="217" y="220" width="20" height="140" rx="3" fill="url(#barGrad2)" />
  <!-- 6 --> <rect x="245" y="160" width="20" height="200" rx="3" fill="url(#barGrad2)" />
  <!-- 7 Active Compare --> <rect x="273" y="190" width="20" height="170" rx="3" fill="#ec4899" />
  <!-- 8 --> <rect x="301" y="250" width="20" height="110" rx="3" fill="url(#barGrad3)" />
  <!-- 9 --> <rect x="329" y="140" width="20" height="220" rx="3" fill="url(#barGrad3)" />
  <!-- 10 --> <rect x="357" y="210" width="20" height="150" rx="3" fill="url(#barGrad3)" />
  <!-- 11 --> <rect x="385" y="280" width="20" height="80" rx="3" fill="url(#barGrad1)" />
  <!-- 12 --> <rect x="413" y="170" width="20" height="190" rx="3" fill="url(#barGrad2)" />

  <text x="199" y="375" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399" text-anchor="middle">PIVOT</text>
  <text x="283" y="375" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ec4899" text-anchor="middle">CMP</text>

  <!-- Right: Tree / Graph Structure -->
  <rect x="470" y="105" width="250" height="280" rx="12" fill="#050811" fill-opacity="0.9" stroke="rgba(255,255,255,0.06)" />
  
  <text x="495" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Binary Tree Traversal</text>

  <!-- Tree Nodes & Edges -->
  <!-- Root -->
  <line x1="595" y1="180" x2="540" y2="235" stroke="#38bdf8" stroke-width="2" />
  <line x1="595" y1="180" x2="650" y2="235" stroke="#818cf8" stroke-width="2" />
  
  <!-- Left children -->
  <line x1="540" y1="235" x2="510" y2="295" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="540" y1="235" x2="565" y2="295" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Right children -->
  <line x1="650" y1="235" x2="625" y2="295" stroke="#818cf8" stroke-width="1.5" />
  <line x1="650" y1="235" x2="675" y2="295" stroke="#818cf8" stroke-width="1.5" />

  <!-- Root Node -->
  <circle cx="595" cy="180" r="18" fill="#1e293b" stroke="#34d399" stroke-width="2" />
  <text x="595" y="184" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">50</text>

  <!-- L1 Left -->
  <circle cx="540" cy="235" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="540" y="239" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">25</text>

  <!-- L1 Right -->
  <circle cx="650" cy="235" r="16" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
  <text x="650" y="239" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#818cf8" text-anchor="middle">75</text>

  <!-- L2 Leaves -->
  <circle cx="510" cy="295" r="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="510" y="299" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e2e8f0" text-anchor="middle">12</text>

  <circle cx="565" cy="295" r="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="565" y="299" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e2e8f0" text-anchor="middle">37</text>

  <circle cx="625" cy="295" r="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
  <text x="625" y="299" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e2e8f0" text-anchor="middle">62</text>

  <circle cx="675" cy="295" r="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
  <text x="675" y="299" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e2e8f0" text-anchor="middle">87</text>

  <!-- Traversal Output -->
  <rect x="490" y="335" width="210" height="30" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.08)" />
  <text x="595" y="354" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">In-Order: 12 25 37 50 62 75 87</text>
</svg>
