  <rect x="515" y="260" width="195" height="125" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="rgba(255,255,255,0.06)" />
  <circle cx="545" cy="285" r="12" fill="#c084fc" fill-opacity="0.2" />
  <text x="567" y="289" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Exploration</text>
