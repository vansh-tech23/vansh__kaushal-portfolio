  <text x="354" y="289" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Tech Stack</text>
  <text x="317" y="315" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">C, C++, JavaScript</text>
