  <rect x="630" y="49" width="65" height="22" rx="6" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-width="0.8" />
  <text x="662" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#818cf8" text-anchor="middle">Mobile</text>

  <!-- Website Mockup Body -->
  <!-- Hero Section Mockup -->
