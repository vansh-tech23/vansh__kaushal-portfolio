<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="100%" stop-color="#0d1830" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad2)" />

  <!-- Background Circles -->
  <circle cx="150" cy="120" r="160" fill="#38bdf8" opacity="0.1" filter="url(#glow2)" />
  <circle cx="680" cy="320" r="180" fill="#c084fc" opacity="0.08" filter="url(#glow2)" />

  <!-- Device Browser Frame -->
  <rect x="60" y="40" width="680" height="370" rx="16" fill="#0b1120" fill-opacity="0.9" stroke="url(#accentGrad)" stroke-width="1.5" />
  
  <!-- Browser Top Bar -->
  <rect x="60" y="40" width="680" height="40" rx="16" fill="#1e293b" fill-opacity="0.8" />
  <rect x="60" y="65" width="680" height="15" fill="#1e293b" fill-opacity="0.8" />
  
  <!-- Dots -->
  <circle cx="85" cy="60" r="5" fill="#ef4444" />
  <circle cx="102" cy="60" r="5" fill="#f59e0b" />
  <circle cx="119" cy="60" r="5" fill="#10b981" />

