<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1124" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Bar -->
  <rect x="20" y="20" width="560" height="40" rx="8" fill="#0f172a" opacity="0.8"/>
  <circle cx="45" cy="40" r="5" fill="#ef4444" />
  <circle cx="62" cy="40" r="5" fill="#eab308" />
  <circle cx="79" cy="40" r="5" fill="#22c55e" />
  <text x="110" y="44" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">face_recognition_stream.py — [OpenCV + DL]</text>
  
  <rect x="460" y="27" width="105" height="24" rx="12" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1"/>
  <text x="512" y="43" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">FPS: 60 | LIVE</text>

  <!-- Viewfinder Grid & Crosshairs -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.5">
    <circle cx="300" cy="180" r="130" fill="none" stroke-dasharray="6 6"/>
    <circle cx="300" cy="180" r="85" fill="none" stroke-dasharray="3 3"/>
    <line x1="300" y1="80" x2="300" y2="280" stroke-dasharray="4 4"/>
    <line x1="180" y1="180" x2="420" y2="180" stroke-dasharray="4 4"/>
  </g>

  <!-- Face Geometric Mesh Silhouette -->
  <!-- Jawline -->
  <path d="M 230 145 Q 230 230 300 255 Q 370 230 370 145 Q 370 100 300 95 Q 230 100 230 145 Z" fill="#0f172a" fill-opacity="0.6" stroke="url(#purpleGrad)" stroke-width="2" filter="url(#glowPurple)"/>
  
  <!-- Facial Landmark Mesh Points & Interconnects -->
  <!-- Forehead to Eyes -->
  <path d="M 260 120 L 300 115 L 340 120 L 300 135 Z" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.8"/>
  <!-- Left Eye Mesh -->
  <polygon points="255,145 275,140 285,148 265,152" fill="#a855f7" fill-opacity="0.25" stroke="#c084fc" stroke-width="1.2"/>
  <circle cx="270" cy="146" r="3" fill="#38bdf8"/>
  <!-- Right Eye Mesh -->
  <polygon points="315,148 325,140 345,145 335,152" fill="#a855f7" fill-opacity="0.25" stroke="#c084fc" stroke-width="1.2"/>
  <circle cx="330" cy="146" r="3" fill="#38bdf8"/>
  <!-- Nose Bridge & Tip -->
  <polygon points="300,135 292,185 308,185" fill="#a855f7" fill-opacity="0.15" stroke="#818cf8" stroke-width="1.2"/>
  <!-- Lips Mesh -->
  <polygon points="280,210 300,205 320,210 300,222" fill="#ec4899" fill-opacity="0.25" stroke="#f472b6" stroke-width="1.2"/>

  <!-- Landmark Dots -->
  <circle cx="260" cy="120" r="2.5" fill="#38bdf8" />
  <circle cx="300" cy="115" r="2.5" fill="#38bdf8" />
  <circle cx="340" cy="120" r="2.5" fill="#38bdf8" />
  <circle cx="235" cy="170" r="2.5" fill="#38bdf8" />
  <circle cx="365" cy="170" r="2.5" fill="#38bdf8" />
  <circle cx="300" cy="255" r="3.5" fill="#34d399" filter="url(#glowPurple)" />

  <!-- Bounding Box Targeting Corners -->
  <g stroke="#38bdf8" stroke-width="3" fill="none" filter="url(#glowPurple)">
    <path d="M 205 100 L 205 80 L 225 80" />
    <path d="M 375 80 L 395 80 L 395 100" />
    <path d="M 395 255 L 395 275 L 375 275" />
    <path d="M 225 275 L 205 275 L 205 255" />
  </g>

  <!-- Left Stats Panel -->
  <g transform="translate(45, 95)">
    <rect width="135" height="150" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1" opacity="0.95"/>
    <text x="12" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">EMBEDDING VECTORS</text>
    <text x="12" y="44" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">dim: 128-d</text>
    <text x="12" y="64" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">DISTANCE METRIC</text>
    <text x="12" y="84" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="11">Cosine: 0.982</text>
    <text x="12" y="104" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">LATENCY</text>
    <text x="12" y="124" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">14.2 ms</text>
    <rect x="12" y="134" width="110" height="4" rx="2" fill="#1e293b"/>
    <rect x="12" y="134" width="98" height="4" rx="2" fill="#34d399"/>
  </g>

  <!-- Right Recognition Result Card -->
  <g transform="translate(420, 115)">
    <rect width="145" height="110" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" filter="url(#glowPurple)"/>
    <circle cx="28" cy="28" r="12" fill="#22c55e" fill-opacity="0.2"/>
    <path d="M 22 28 L 26 32 L 34 24" stroke="#22c55e" stroke-width="2" fill="none"/>
    <text x="46" y="32" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">MATCH VERIFIED</text>
    
    <text x="14" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">CONFIDENCE SCORE</text>
    <text x="14" y="80" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">99.4%</text>
    <text x="14" y="98" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Haar + ResNet DL</text>
  </g>
</svg>
