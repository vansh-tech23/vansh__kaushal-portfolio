<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="vkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0b1120" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>
  <text x="50" y="62" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="40" font-weight="900" fill="url(#vkGrad)" text-anchor="middle" filter="url(#glow)">&lt;V/&gt;</text>
</svg>
