<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Glowing Rings -->
  <circle cx="150" cy="150" r="140" fill="none" stroke="url(#avatarGlow)" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="150" cy="150" r="130" fill="url(#darkBg)" stroke="url(#avatarGlow)" stroke-width="3" filter="url(#glowEffect)"/>

  <!-- Geometric Developer Icon / Silhouette -->
  <!-- Hoodie / Shoulders -->
  <path d="M 80 240 Q 150 200 220 240 L 220 260 L 80 260 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Head / Face -->
  <path d="M 115 135 Q 115 185 150 195 Q 185 185 185 135 Q 185 95 150 95 Q 115 95 115 135 Z" fill="#334155" stroke="#818cf8" stroke-width="2"/>
  
  <!-- Modern Hair Style -->
  <path d="M 110 120 Q 140 75 190 100 Q 170 80 140 85 Q 115 95 110 120 Z" fill="url(#avatarGlow)"/>

  <!-- Modern Tech Glasses / Visor -->
  <rect x="120" y="125" width="25" height="16" rx="4" fill="#0369a1" fill-opacity="0.8" stroke="#38bdf8" stroke-width="2" filter="url(#glowEffect)"/>
  <rect x="155" y="125" width="25" height="16" rx="4" fill="#0369a1" fill-opacity="0.8" stroke="#38bdf8" stroke-width="2" filter="url(#glowEffect)"/>
  <line x1="145" y1="133" x2="155" y2="133" stroke="#38bdf8" stroke-width="2"/>

  <!-- Code symbol badge in chest -->
  <circle cx="150" cy="225" r="16" fill="#0b1329" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="150" y="230" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">&lt;/&gt;</text>
</svg>
