<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071524" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#bgGrad3)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Bar -->
  <rect x="20" y="20" width="560" height="40" rx="8" fill="#0f172a" opacity="0.8"/>
  <circle cx="45" cy="40" r="5" fill="#ef4444" />
  <circle cx="62" cy="40" r="5" fill="#eab308" />
  <circle cx="79" cy="40" r="5" fill="#22c55e" />
  <text x="110" y="44" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">nlp_conversational_engine.py — [NLTK &amp; Tokenizer]</text>

  <rect x="470" y="27" width="95" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="517" y="43" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">ONLINE 24/7</text>

  <!-- Conversational Flow Graphic -->
  <!-- User Query Bubble -->
  <g transform="translate(60, 85)">
    <rect width="250" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <circle cx="28" cy="30" r="14" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="28" y="34" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">USR</text>
    <text x="54" y="28" fill="#f1f5f9" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500">How do I compute TF-IDF?</text>
    <text x="54" y="46" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">intent: #nlp_query (0.97)</text>
  </g>

  <!-- NLP Processing Pipeline Node in Middle -->
  <g transform="translate(340, 95)">
    <rect width="200" height="50" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="16" y="24" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">PIPELINE: Tokenize → Stem</text>
    <text x="16" y="40" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Stopwords Removed: [how, do, i]</text>
  </g>

  <!-- Connector Line -->
  <path d="M 310 115 L 340 115" stroke="#10b981" stroke-width="2" stroke-dasharray="2 2"/>

  <!-- Chatbot Response Bubble -->
  <g transform="translate(140, 175)">
    <rect width="400" height="90" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#glowGreen)"/>
    <circle cx="32" cy="36" r="16" fill="url(#emeraldGrad)"/>
    <text x="32" y="42" fill="#042f2e" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">AI</text>
    
    <text x="60" y="34" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">NLP Assistant Bot</text>
    <text x="60" y="54" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">"TF-IDF measures word importance: Term Frequency multiplied</text>
    <text x="60" y="72" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">by Inverse Document Frequency across your corpus."</text>
  </g>

  <!-- Token Vectors Tag Cloud Bottom Left -->
  <g transform="translate(60, 285)">
    <rect x="0" y="0" width="80" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="40" y="17" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Cosine Sim</text>

    <rect x="90" y="0" width="85" height="26" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <text x="132" y="17" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">BoW Vector</text>

    <rect x="185" y="0" width="90" height="26" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="230" y="17" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">NLTK Parser</text>

    <rect x="285" y="0" width="80" height="26" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="325" y="17" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Regex Rule</text>

    <rect x="375" y="0" width="90" height="26" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
    <text x="420" y="17" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Intent Match</text>
  </g>
</svg>
